name: Build and Package Tasks

on:
  push:
    branches: [main]

jobs:
  build-and-pack:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"  # 不执行带有 [skip ci] 的提交
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller pycryptodome

      - name: Make pack.sh executable
        run: chmod +x ./util/pack.sh
        
      - name: Compile grade.py
        run: ./util/pack.sh ./tasks/grade.py
        
      - name: Compile taskN scripts
        shell: bash
        run: |
          set -e
          for task_dir in ./tasks/task*/; do
            task_file="${task_dir%/}/$(basename ${task_dir%/}).py"
            if [ -f "$task_file" ]; then
              echo "Packing $task_file..."
              ./util/pack.sh "$task_file"
            fi
          done

      - name: Set platform name
        id: platform
        shell: bash
        run: |
          if [[ "${{ matrix.os }}" == "ubuntu-latest" ]]; then
            echo "PLATFORM=linux" >> $GITHUB_ENV
          elif [[ "${{ matrix.os }}" == "macos-latest" ]]; then
            echo "PLATFORM=macos" >> $GITHUB_ENV
          else
            echo "Unsupported matrix.os"; exit 1
          fi

      - name: Prepare platform package
        shell: bash
        run: |
          set -e
          mkdir -p dist/package-$PLATFORM
          cp -a ./tasks dist/package-$PLATFORM/
          # FIXME: dirty fix, rsync 应该可以 exclude, 但先这样修了
          find dist/package-$PLATFORM/tasks -type f -name '*.py' ! -path '*/task4/tool/main.py' -delete

          if [ ! -x dist/package-$PLATFORM/tasks/grade ] && [ -f dist/grade ]; then
            cp dist/grade dist/package-$PLATFORM/tasks/grade
            chmod +x dist/package-$PLATFORM/tasks/grade
          fi

          if [ -d ./etc ]; then
            cp -a ./etc dist/package-$PLATFORM/
          fi

          chmod +x dist/package-$PLATFORM/tasks/task4/tool/main.py || true
          find dist/package-$PLATFORM -type f -executable -exec chmod +x {} \; || true
          tar -C dist/package-$PLATFORM -czvf dist/auto-grading-$PLATFORM.tar.gz .
          
      - name: Upload platform artifact
        uses: actions/upload-artifact@v4
        with:
          name: auto-grading-${{ env.PLATFORM }}
          path: dist/auto-grading-${{ env.PLATFORM }}.tar.gz

  release:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"  # 不执行带有 [skip ci] 的提交
    runs-on: ubuntu-latest
    needs: build-and-pack
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist/all
          merge-multiple: false
          
      - name: Determine next version
        id: version
        shell: bash
        run: |
          git fetch --tags origin
          latest=$(git tag -l "v*" --sort=-v:refname | head -n1 || true)
          if [ -z "$latest" ]; then
            version="1.0.0"
          else
            major=$(echo "$latest" | cut -d. -f1 | tr -d 'v')
            minor=$(echo "$latest" | cut -d. -f2)
            patch=$(echo "$latest" | cut -d. -f3)
            patch=$((patch + 1))
            version="$major.$minor.$patch"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Next version: $version"

      - name: List artifacts
        run: |
          echo "Artifacts tree:"
          ls -R dist/all || true
          files=$(ls dist/all/**/auto-grading-*.tar.gz 2>/dev/null | wc -l)
          if [ "$files" -lt 1 ]; then
            echo "No packaging artifacts found!"; exit 1
          fi

      - name: Create Release with gh CLI
        run: |
          gh release create "v${{ steps.version.outputs.version }}" \
            dist/all/**/auto-grading-*.tar.gz \
            --title "Release v${{ steps.version.outputs.version }}" \
            --notes "Release version v${{ steps.version.outputs.version }} (Linux & macOS) built on $(date +"%Y-%m-%d %H:%M:%S")"
        env:
          GH_TOKEN: ${{ secrets.REPO_TOKEN }}
