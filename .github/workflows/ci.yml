name: Build and Package Tasks

on:
  push:
    branches: [main]

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
    # 1. 检出代码
    - name: Checkout repository
      uses: actions/checkout@v3

    # 2. 设置 Python
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    # 3. 安装 PyInstaller
    - name: Install PyInstaller
      run: pip install pyinstaller

    # 4. 设置 pack.sh 可执行权限
    - name: Set execute permission for pack.sh
      run: chmod +x ./util/pack.sh

    # 5. 编译 grade.py
    - name: Compile grade.py
      run: ./util/pack.sh ./tasks/grade.py

    # 6. 编译 taskN 脚本
    - name: Compile taskN scripts
      run: |
        for task_dir in ./tasks/task*/; do
          task_file="${task_dir%/}/$(basename ${task_dir%/}).py"
          if [ -f "$task_file" ]; then
            echo "Packing $task_file..."
            ./util/pack.sh "$task_file"
          fi
        done

    # 7. 生成下一个版本号
    - name: Determine next version
      id: version
      run: |
        latest=$(git tag -l "v*" --sort=-v:refname | head -n1)
        if [ -z "$latest" ]; then
          version="1.0.0"
        else
          major=$(echo $latest | cut -d. -f1 | tr -d 'v')
          minor=$(echo $latest | cut -d. -f2)
          patch=$(echo $latest | cut -d. -f3)
          patch=$((patch + 1))
          version="$major.$minor.$patch"
        fi
        echo "version=$version" >> $GITHUB_OUTPUT
        echo "Next version: $version"

    # 8. 准备 tar 包（自动识别可执行文件）
    - name: Prepare tar package
      run: |
        mkdir -p dist/package

        # 拷贝 grade 可执行文件
        grade_output=$(find ./tasks -maxdepth 1 -type f -executable -name "grade*" | head -n1)
        if [ -z "$grade_output" ]; then
          echo "Error: grade executable not found!"
          exit 1
        fi
        cp "$grade_output" dist/package/

        # 遍历 taskN 目录
        for task_dir in ./tasks/task*/; do
          task_name=$(basename $task_dir)
          mkdir -p dist/package/$task_name

          task_exe=$(find "$task_dir" -maxdepth 1 -type f -executable -name "$task_name*" | head -n1)
          if [ -n "$task_exe" ]; then
            cp "$task_exe" "dist/package/$task_name/"
          fi

          find "$task_dir" -maxdepth 1 -type f ! -name "*.py" -exec cp {} "dist/package/$task_name/" \;
        done

        # 给所有可执行文件加权限，避免 Permission denied
        find dist/package -type f -executable -exec chmod +x {} \;

        # 打包 grade 和 taskN，避免生成多余的 . 文件夹
        cd dist/package
        tar -cvf ../interview-autograding.tar *
        cd -

    # 9. 创建 GitHub Release
    - name: Create Release with gh CLI
      run: |
        gh release create v${{ steps.version.outputs.version }} \
        dist/interview-autograding.tar \
        --title "Release v${{ steps.version.outputs.version }}" \
        --notes "Release version v${{ steps.version.outputs.version}} generated on $(date +"%Y-%m-%d %H:%M:%S")"
      env:
        GH_TOKEN: ${{ secrets.REPO_TOKEN }}
